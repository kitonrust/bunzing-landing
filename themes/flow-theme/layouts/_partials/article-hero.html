{{ $article := .article }}
{{ $feature := "" }}
{{ with $article.Resources.GetMatch "feature.jpg" }}
  {{ $feature = . }}
{{ end }}

<article class="hero-article overflow-hidden border-b border-lime-50 bg-blue-700 pb-8 rounded-lg">
  <a href="{{ $article.RelPermalink }}">
    {{ with $feature }}
      <img src="{{ .RelPermalink }}" alt="{{ $article.Title }}" class="w-full h-96 object-cover rounded-t-lg" />
    {{ end }}
    <div class="pt-6 px-4 text-lime-100">
      <p class="text-sm uppercase font-bold font-sans">{{ $article.Params.category }}</p>
      <h1 class="text-5xl font-extrabold my-4">{{ $article.Title }}</h1>
      <p class="text-lg">{{ $article.Params.short_description }}</p>
      <p class="italic mt-6">door {{ $article.Params.author }}</p>
    </div>
  </a>
</article>
